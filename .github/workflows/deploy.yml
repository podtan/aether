name: Deploy to Server

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Build binaries
      run: cargo build --release --bin aether --bin aether-web
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        port: ${{ secrets.SERVER_PORT }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Create deployment directory structure
          sudo mkdir -p /opt/aether/mcp/bin
          sudo mkdir -p /opt/aether/mcp/configs
          sudo mkdir -p /opt/aether/web/bin
          sudo mkdir -p /opt/aether/backup
          
          # Backup existing binaries if they exist
          if [ -f /opt/aether/mcp/bin/aether ]; then
            sudo cp /opt/aether/mcp/bin/aether /opt/aether/backup/aether.bak.$(date +%Y%m%d_%H%M%S)
          fi
          if [ -f /opt/aether/web/bin/aether-web ]; then
            sudo cp /opt/aether/web/bin/aether-web /opt/aether/backup/aether-web.bak.$(date +%Y%m%d_%H%M%S)
          fi
    - name: Copy binaries to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        port: ${{ secrets.SERVER_PORT }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "target/release/aether,target/release/aether-web,config.toml.example"
        target: "/tmp/aether-deploy/"
        strip_components: 2
    - name: Install binaries, create services, and restart
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        port: ${{ secrets.SERVER_PORT }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Move binaries to their respective directories
          sudo mv /tmp/aether-deploy/aether /opt/aether/mcp/bin/aether
          sudo mv /tmp/aether-deploy/aether-web /opt/aether/web/bin/aether-web
          
          # Copy config template to web directory if config doesn't exist
          if [ ! -f /opt/aether/web/config.toml ]; then
            sudo cp /tmp/aether-deploy/config.toml.example /opt/aether/web/config.toml
          fi
          
          # Set executable permissions
          sudo chmod +x /opt/aether/mcp/bin/aether
          sudo chmod +x /opt/aether/web/bin/aether-web
          
          # Clean up old backups (keep only last 5)
          sudo find /opt/aether/backup -name "*.bak.*" -type f | sort -r | tail -n +6 | xargs -r sudo rm -f
          
          # Create systemd service for aether MCP if it does not exist
          if [ ! -f /etc/systemd/system/aether.service ]; then
            sudo tee /etc/systemd/system/aether.service > /dev/null <<'EOF'
          [Unit]
          Description=Aether MCP Service
          After=network.target
          
          [Service]
          Type=simple
          ExecStart=/opt/aether/mcp/bin/aether --multi-config --configs-dir /opt/aether/mcp/configs --host 127.0.0.1 --port 8000
          WorkingDirectory=/opt/aether/mcp
          Restart=on-failure
          User=pdt
          Environment=RUST_LOG=info
          
          [Install]
          WantedBy=multi-user.target
          EOF
            sudo systemctl daemon-reload
            sudo systemctl enable aether
          fi
          
          # Create systemd service for aether-web if it does not exist
          if [ ! -f /etc/systemd/system/aether-web.service ]; then
            sudo tee /etc/systemd/system/aether-web.service > /dev/null <<'EOF'
          [Unit]
          Description=Aether Web Service
          After=network.target
          
          [Service]
          Type=simple
          ExecStart=/opt/aether/web/bin/aether-web --host 127.0.0.1 --port 9001
          WorkingDirectory=/opt/aether/web
          Restart=on-failure
          User=pdt
          Environment=RUST_LOG=info
          
          [Install]
          WantedBy=multi-user.target
          EOF
            sudo systemctl daemon-reload
            sudo systemctl enable aether-web
          fi
          
          # Restart both services
          sudo systemctl restart aether || true
          sudo systemctl restart aether-web || true
          echo "Deployment completed successfully - both MCP and Web services restarted"
