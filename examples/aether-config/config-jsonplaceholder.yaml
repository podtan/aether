# Aether Configuration Example

server:
  host: "127.0.0.1"
  port: 8080
  log_level: "info"

# Define APIs to expose
apis:
  jsonplaceholder:
    base_url: "https://jsonplaceholder.typicode.com"
    openapi_spec: "examples/openapi/jsonplaceholder-openapi.yaml"
    timeout: 30
  
